<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Performance Data Visualization</title>
    <link rel="stylesheet" href="../css/D3Visualization.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <!-- Home Button -->
    <a href="index.html" class="home-btn"> ← </a>
    
    <div class="container">
        <!-- User Selection -->
        <div class="controls">
            <label for="user-select">Select User ID: </label>
            <select id="user-select">
                <option value="user_1">ID 1</option>
                <option value="user_2">ID 2</option>
                <option value="user_3">ID 3</option>
                <option value="user_4">ID 4</option>
                <option value="user_5">ID 5</option>
            </select>
            
            <label for="date-input" style="margin-left: 20px;">Date: </label>
            <input type="date" id="date-input">
            
            <button id="load-btn">Load Data</button>
            
            <span id="current-time" style="margin-left: 20px; font-weight: bold; color: #2196f3;"></span>
        </div>
        
         <!-- Charts Section -->
        <div class="chart-section">
            <h2>Blood Pressure (BP)</h2>
            <div id="bp-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Heart Rate (HR)</h2>
            <div id="hr-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Heart Rate Variability (HRV)</h2>
            <div id="hrv-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Respiratory Rate (RR)</h2>
            <div id="rr-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>SpO2 (Oxygen Saturation)</h2>
            <div id="spo2-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Temperature</h2>
            <div id="temp-chart" class="loading">Loading...</div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="../D3Visualization.js"></script>
</body>
</html>
