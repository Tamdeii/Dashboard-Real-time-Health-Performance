<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Performance Data Visualization</title>
    <link rel="stylesheet" href="../css/D3Visualization.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <!-- Home Button -->
    <a href="index.html" class="home-btn"> ← </a>
    
    <div class="container">
        <!-- User Selection -->
        <div class="controls">
            <label for="date-input" style="margin-left: 20px;">Date: </label>
            <input type="date" id="date-input">
            
            <button id="load-btn">Load Data</button>
            
            <span id="health-status" style="margin-left: 30px; font-weight: bold; font-size: 16px; padding: 5px 15px; border-radius: 5px; background-color: #f0f0f0; color: #666;">Status: Loading...</span>
            <span id="rule-explanation" style="margin-left: 15px; font-size: 14px; color: #f44336; font-weight: 500; display: none;"></span>
            <span id="current-time" style="margin-left: 20px; font-weight: bold; color: #2196f3;"></span>
            <span id="api-status" style="margin-left: 20px; font-size: 12px; color: #666;"></span>
        </div>
        
         <!-- Charts Section -->
        <div class="chart-section">
            <h2>Blood Pressure (BP)</h2>
            <div id="bp-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Heart Rate (HR)</h2>
            <div id="hr-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Heart Rate Variability (HRV)</h2>
            <div id="hrv-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Respiratory Rate (RR)</h2>
            <div id="rr-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>SpO2 (Oxygen Saturation)</h2>
            <div id="spo2-chart" class="loading">Loading...</div>
        </div>
        
        <div class="chart-section">
            <h2>Temperature</h2>
            <div id="temp-chart" class="loading">Loading...</div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="../api.js"></script>
    <script src="../D3Visualization.js"></script>
</body>
</html>
